name: Construir APK de Luma Player

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Extraer el proyecto Android
        run: unzip -q LumaPlayer-Android-GitHub-APK.zip -d project

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar componentes Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ajustar compatibilidad JVM
        working-directory: project
        run: |
          awk '{
            print
            if ($0 ~ /compileSdk 35/) {
              print "    compileOptions {"
              print "        sourceCompatibility JavaVersion.VERSION_17"
              print "        targetCompatibility JavaVersion.VERSION_17"
              print "    }"
            }
          }' app/build.gradle > app/build.gradle.tmp
          mv app/build.gradle.tmp app/build.gradle

      - name: Compilar APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: LumaPlayer-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
